<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schulungsbereich – elektromas GmbH</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../assets/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="../assets/favicon-192.png">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="schulung.css">
</head>
<body>

  <div class="wrap">

    <header class="page__head">
      <a href="../"><img class="logo" src="../assets/elektromas-logo.png"
           alt="elektromas GmbH" width="389" height="149"></a>
      <div class="page__title">
        <h1>Schulungsbereich</h1>
        <p>Alle freigegebenen Schulungen der elektromas GmbH</p>
      </div>
    </header>

    <main>
      <label class="visually-hidden" for="filter">Schulungen durchsuchen</label>
      <input class="filter" id="filter" type="search" autocomplete="off"
             placeholder="Schulung suchen – Titel, Thema oder Kategorie …">

      <ul class="kurse" id="kurse"></ul>

      <p class="hinweis" id="hinweis">Schulungen werden geladen …</p>
    </main>

    <footer class="page__foot">
      <p>&copy; <span id="year">2026</span> elektromas GmbH</p>
      <p><a href="../">&larr; Zurück zur Startseite</a></p>
    </footer>

  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const liste   = document.getElementById('kurse');
    const hinweis = document.getElementById('hinweis');
    const filter  = document.getElementById('filter');

    let schulungen = [];

    const esc = (wert) => String(wert == null ? '' : wert).replace(/[&<>"']/g, (z) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[z]));

    const datumText = (iso) => {
      if (!iso) return '';
      const d = new Date(iso);
      return isNaN(d) ? iso : d.toLocaleDateString('de-DE',
        { day: '2-digit', month: 'long', year: 'numeric' });
    };

    function zeichnen(eintraege) {
      liste.innerHTML = eintraege.map((s) => {
        const meta = [datumText(s.datum), s.dauer].filter(Boolean).map(esc).join(' &middot; ');
        return '<li><a class="kurs" href="' + esc(s.link) + '">'
          + '<div class="kurs__meta">'
          + (s.typ ? '<span class="tag tag--typ">' + esc(s.typ) + '</span>' : '')
          + (s.kategorie ? '<span class="tag">' + esc(s.kategorie) + '</span>' : '')
          + '</div>'
          + '<h3>' + esc(s.titel) + '</h3>'
          + (s.beschreibung ? '<p>' + esc(s.beschreibung) + '</p>' : '')
          + '<div class="kurs__foot">' + meta + '</div>'
          + '</a></li>';
      }).join('');

      hinweis.hidden = eintraege.length > 0;
      if (!eintraege.length) {
        hinweis.textContent = schulungen.length
          ? 'Keine Schulung passt zu Ihrer Suche.'
          : 'Aktuell sind keine Schulungen veröffentlicht.';
      }
    }

    function suchen() {
      const q = filter.value.trim().toLowerCase();
      if (!q) { zeichnen(schulungen); return; }
      zeichnen(schulungen.filter((s) =>
        [s.titel, s.beschreibung, s.kategorie, s.typ]
          .filter(Boolean).join(' ').toLowerCase().indexOf(q) !== -1
      ));
    }

    filter.addEventListener('input', suchen);

    fetch('schulungen.json', { cache: 'no-store' })
      .then((r) => {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then((daten) => {
        schulungen = (Array.isArray(daten) ? daten : [])
          .filter((s) => s && s.titel && s.link)
          .sort((a, b) => String(b.datum || '').localeCompare(String(a.datum || '')));
        suchen();
      })
      .catch(() => {
        liste.innerHTML = '';
        hinweis.hidden = false;
        hinweis.textContent =
          'Die Schulungsliste konnte nicht geladen werden. Bitte wenden Sie sich an isaev@elektromas.de.';
      });
  </script>

</body>
</html>
